<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Grill Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Charcoal Brazier Base -->
    <path d="M20 70 Q 50 95 80 70 L 75 85 Q 50 102 25 85 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Grill Grate -->
    <ellipse cx="50" cy="65" rx="36" ry="12" fill="#18181B" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="75" y2="65" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <line x1="32" y1="58" x2="68" y2="72" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="32" y1="72" x2="68" y2="58" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Crossed Skewers -->
    <line x1="12" y1="20" x2="88" y2="90" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="88" y1="20" x2="12" y2="90" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Flaming Ember Core -->
    <path d="M50 12 C 45 25 35 32 40 48 C 43 54 47 56 50 60 C 53 56 57 54 60 48 C 65 32 55 25 50 12 Z" fill="url(#fireGrad)" filter="url(#glow)"/>
    <path d="M50 24 C 47 32 42 38 45 48 C 47 52 49 53 50 56 C 51 53 53 52 55 48 C 58 38 53 32 50 24 Z" fill="#FEF08A"/>
    <!-- Sparkles -->
    <circle cx="36" cy="22" r="1.5" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="64" cy="26" r="1.5" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="50" cy="6" r="2" fill="#FDE68A" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="125" y="58" font-family="'Cairo', sans-serif" font-size="36" font-weight="900" fill="url(#goldGrad)" letter-spacing="1">
    مشويات أبو حمزة
  </text>
  <text x="125" y="85" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#E4E4E7" letter-spacing="2">
    أصل المشوي المصري على الفحم البلدي
  </text>
  <line x1="125" y1="96" x2="385" y2="96" stroke="url(#fireGrad)" stroke-width="1.5" opacity="0.7"/>
</svg>
